version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - node -v
        - npm ci
    build:
      commands:
        # Las variables de la consola de Amplify no llegan solas al runtime SSR:
        # se copian a .env.production para que Next.js las cargue.
        - env | grep -E '^(APP_REGION|DDB_TABLE|S3_BUCKET|BEDROCK_MODEL_ID)=' >> .env.production || echo "Aviso: faltan variables de entorno en la consola de Amplify"
        - cut -d= -f1 .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
